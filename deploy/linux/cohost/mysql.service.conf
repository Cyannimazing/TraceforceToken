# MySQL Community 8.4 APT package service; install as:
# /etc/systemd/system/mysql.service.d/50-traceforce-cohost.conf
# Keep the vendor ExecStart, sandbox, user, and data-directory settings.
[Service]
CPUAccounting=true
CPUQuota=20%
MemoryAccounting=true
MemoryHigh=640M
MemoryMax=768M
MemorySwapMax=0
TasksMax=96
